name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "잘못된 태그 형식: $env:TAG" }
          $file = "src/yt_launcher/version.py"
          (Get-Content $file -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$version`"" |
            Set-Content $file -Encoding utf8NoBOM -NoNewline
          python -c "import sys; sys.path.insert(0, 'src'); import yt_launcher.version as v; assert v.__version__ == sys.argv[1], v.__version__" $version
          if ($LASTEXITCODE -ne 0) { throw "version.py 갱신 확인 실패" }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        run: ./scripts/build.ps1 -Version $env:APP_VERSION -Python python
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/YT-Launcher-Setup-${{ env.APP_VERSION }}.exe
            dist/installer/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
